name: Rust tests

# Runs the Rust unit tests for the MCP transport, OAuth, folder routing and
# tunnel modules whenever Rust sources change. Runs in parallel with the
# Windows auto-build and does not gate the release.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  workflow_dispatch:

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test (transport, OAuth, routing, tunnel, settings)
        working-directory: src-tauri
        run: >-
          cargo test --lib --
          tunnel::cloudflare
          mcp::listener::tests
          auth::
          mcp::server::tests
          tools::hub
          settings::
          health::
          mcp::activity::
          commands::activity::
          tools::patch::
          tools::chat::tests
          platform::open
