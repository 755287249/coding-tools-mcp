name: Local Chat (Windows portable)

on:
  push:
    branches: [coderabbit/mcp-ai-local-chat/c2753b71]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified build as a personal GitHub release
        type: boolean
        required: false
        default: true

      stable_release:
        description: Publish a stable release visible to the built-in updater
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: chat-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-chat-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false
      - name: Test personal release publishing guards
        run: python tests/publish-chat-release.test.py
      - name: Test chat storage on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib tools::chat::tests
      - name: Test native taskbar icon slots and theme pixels
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib icon_theme
      - name: Test group chat dispatch and member isolation
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test chat_group_contract --test chat_contract
      - name: Test local file manager paths
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib platform::reveal::tests
      - name: Test desktop upgrade selection and runtime snapshot
        shell: powershell
        run: ./tests/desktop-startup-handoff.Tests.ps1
      - name: Exercise upgrade and rollback with isolated dummy executables
        shell: powershell
        run: ./tests/desktop-startup-handoff.Integration.ps1

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          version: 12.0.0
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run version:check
      - run: pnpm run check
      - name: Test chat prompts
        run: node --test tests/local-chat-prompt.test.mjs tests/chat-preview.test.mjs tests/chat-preview-window.test.mjs tests/chat-task-state.test.mjs tests/chat-status.test.mjs tests/chat-tool-activity.test.mjs tests/chat-drafts.test.mjs tests/chat-session-cache.test.mjs tests/chat-connection.test.mjs tests/chat-mentions.test.mjs tests/chat-navigation.test.mjs tests/chat-schedules.test.mjs tests/chat-artifact-links.test.mjs tests/chat-local-links.test.mjs tests/portable-output-layout.test.mjs
      - name: Build production portable ZIP
        run: pnpm run desktop:portable
      - name: Verify ZIP and write checksum
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "dist-portable/ctmcp-$version-win64.zip"
          if (!(Test-Path $zip)) { throw "Missing portable ZIP" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entry = $archive.GetEntry("ctmcp-$version-win64/ctmcp.exe")
            if (!$entry -or $entry.Length -lt 2000000) { throw "Missing or invalid desktop executable" }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ctmcp-$version-win64.zip" | Set-Content dist-portable/SHA256SUMS.txt
          "Version: $version; commit: $env:GITHUB_SHA; bytes: $((Get-Item $zip).Length)" >> $env:GITHUB_STEP_SUMMARY
          $exe = "dist-portable/ctmcp-$version-win64.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 2000000) { throw "Missing standalone EXE" }
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  ctmcp-$version-win64.exe" | Add-Content dist-portable/SHA256SUMS.txt
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-Content dist-portable/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: local-chat-windows-${{ github.sha }}
          path: |
            dist-portable/*.zip
            dist-portable/*.exe
            dist-portable/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compiler-timings-${{ github.sha }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  publish-personal-release:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_release
    needs: [windows-chat-tests, windows-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check personal release authorization
        id: authorization
        env:
          PERSONAL_RELEASE_TOKEN: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
        run: |
          if [ -z "$PERSONAL_RELEASE_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Standalone EXE was built. Configure PERSONAL_RELEASE_TOKEN to publish Releases as the repository owner. No bot-token fallback is used."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.authorization.outputs.available == 'true'
      - uses: actions/download-artifact@v4
        if: steps.authorization.outputs.available == 'true'
        with:
          name: local-chat-windows-${{ github.sha }}
          path: release-files
      - name: Publish one directly downloadable EXE as the owner
        if: steps.authorization.outputs.available == 'true'
        env:
          PERSONAL_RELEASE_TOKEN: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_STABLE: ${{ inputs.stable_release && 'true' || 'false' }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.windows-portable.outputs.version }}
        run: python3 scripts/publish-chat-release.py release-files
