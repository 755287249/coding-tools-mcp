<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="ctmcp-admin-token" content="" />
    <meta name="description" content="Coding Tools MCP Headless Agent management interface" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <title>Coding Tools MCP</title>
    <script src="%sveltekit.assets%/theme.js"></script>
    <style>
      #startup-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(ellipse at 48% 56%,#291f20 0%,#211e22 48%,#202020 100%);color:#c9c6cb;font-family:system-ui,sans-serif}
      #startup-splash .startup-mark{width:60px;height:60px;object-fit:contain;animation:startup-pulse 1.8s ease-in-out infinite}
      #startup-splash .startup-retry{position:absolute;left:50%;top:calc(50% + 65px);transform:translateX(-50%);display:grid;place-items:center;width:40px;height:40px;border:1px solid #ffffff26;border-radius:50%;color:inherit;text-decoration:none;font-size:22px;visibility:hidden;animation:startup-retry 0s 15s forwards}
      #startup-splash .startup-retry:focus-visible{outline:2px solid #b9b4c5;outline-offset:4px}
      [data-theme="light"] #startup-splash{background:#fff;color:#34343a}
      @keyframes startup-pulse{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
      @keyframes startup-retry{to{visibility:visible}}
      @media(prefers-reduced-motion:reduce){#startup-splash .startup-mark{animation:none}}
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-ui-framework="svelte">
    <div id="startup-splash" role="status" aria-busy="true" aria-label="Coding Tools MCP" data-tauri-drag-region>
      <img class="startup-mark" src="%sveltekit.assets%/app-icon.svg?v=browser-share" alt="Coding Tools MCP" width="60" height="60" />
      <a class="startup-retry" href="" aria-label="Reload / 重新加载" title="Reload / 重新加载">↻</a>
    </div>
    <div class="svelte-app">%sveltekit.body%</div>
  </body>
</html>
