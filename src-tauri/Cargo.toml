[package]
name = "coding-tools-mcp-desktop"
version = "0.1.103"
description = "Coding Tools MCP desktop client"
authors = ["Coding Tools MCP Contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "coding_tools_mcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coding-tools-mcp-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "ctmcp-protect"
path = "src/bin/ctmcp-protect.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
walkdir = "2"
ignore = "0.4"
regex = "1"
glob = "0.3"
similar = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
shlex = "1"
shell-words = "1"
which = "7"
zip = "2"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
coding-tools-tunnel-protocol = { path = "../crates/tunnel-protocol" }
coding-tools-command-policy = { path = "../crates/command-policy" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 0
incremental = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.61.2"

[target.'cfg(unix)'.dependencies]
aes-gcm = "0.10"
libc = "0.2"
